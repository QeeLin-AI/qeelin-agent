[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qeelin-agent"
version = "1.1.5"
description = "币圈永续合约多智能体交易与研究框架（分析师→辩论→交易员→成本闸→风控→持仓管理）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "certifi>=2024.2.2"]

[project.optional-dependencies]
# 测试依赖：README 让用户 `pip install -e .` 后跑 pytest，就必须能装上
test = ["pytest>=8.0"]

[project.scripts]
cryptoagent = "cryptoagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]