# 可选模板：用 nginx 反代 + 自己的域名 + TLS，替代 SSH 隧道
#
# **默认部署不使用本文件**：qeelin-agent.service 直接监听 8000，由云安全组
# 只放行 22/8000。只有需要域名 + TLS + IP 白名单时才复制本文件到
# /etc/nginx/sites-available/ 并启用。
#
# 前提：已经申请域名、拿到证书（certbot --nginx -d trade.example.com）
# 并且 /opt/crypto-agent/.env 里的 CRYPTOAGENT_WEB_TOKEN 已设置。
#
# 建议再套一层 HTTP Basic Auth：万一令牌泄露，还有第二道。

server {
    listen 443 ssl http2;
    server_name trade.example.com;

    ssl_certificate     /etc/letsencrypt/live/trade.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.example.com/privkey.pem;

    # 只允许你自己的出口 IP（把 1.2.3.4 换成你的）
    # allow 1.2.3.4;
    # deny all;

    # 第二道锁：Basic Auth
    # htpasswd -c /etc/nginx/.htpasswd you
    # auth_basic "crypto-agent";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 决策/研究/扫描是同步长请求，别让 nginx 5s 就掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name trade.example.com;
    return 301 https://$host$request_uri;
}
